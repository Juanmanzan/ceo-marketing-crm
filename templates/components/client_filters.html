<div class="tools">
  <div aria-label="Filtrar clientes por estado" class="filter-group" role="group">
    <button aria-pressed="true" class="filter-btn" data-status="Todos">Todos</button>
    <button aria-pressed="false" class="filter-btn" data-status="Prospecto">Prospectos</button>
    <button aria-pressed="false" class="filter-btn" data-status="Cliente">Clientes</button>
    <button aria-pressed="false" class="filter-btn" data-status="Inactivo">Inactivos</button>
  </div>

  <label class="table-search">
    <svg fill="none" stroke="currentColor">
      <use href="#i-search"></use>
    </svg>
    <input aria-label="Buscar por nombre o empresa" id="tableSearch" placeholder="Nombre o empresa..."/>
  </label>
</div>
