<div class="overlay" hidden="" id="deleteOverlay">
  <section aria-describedby="deleteCopy" aria-labelledby="deleteTitle" aria-modal="true" class="modal small" role="alertdialog">
    <header class="modal-head">
      <div>
        <h3 id="deleteTitle">¿Eliminar cliente?</h3>
        <p>Esta acción requiere confirmación.</p>
      </div>

      <button aria-label="Cerrar" class="icon-btn" data-close="deleteOverlay">
        <svg fill="none" stroke="currentColor">
          <use href="#i-close"></use>
        </svg>
      </button>
    </header>

    <div class="modal-body">
      <p class="confirm-copy" id="deleteCopy">¿Deseas eliminar este cliente? Esta acción no se puede deshacer.</p>
    </div>

    <footer class="modal-footer">
      <button class="btn" data-close="deleteOverlay">Cancelar</button>
      <button class="btn btn-danger" id="confirmDelete">Sí, eliminar</button>
    </footer>
  </section>
</div>
